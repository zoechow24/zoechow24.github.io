# 60 Words About the Author
author-about: |
  I am a graduate student at Northeastern University pursuing my M.S. in Bioinformatics and currently completing a co-op at Pfizer. My academic and professional journey has been shaped by a strong interest in both medicine and technology, and I'm particularly motivated by opportunities to connect the two through bioinformatics, data analytics, and machine learning.

  I enjoy building tools and programs that help make sense of complex biological and chemical data, and I'm excited by the challenge of translating experimental data into actionable insights. Previously, I worked as a research technician at Weill Cornell Medical School. Long term, I hope to contribute to advances in genetics, drug development, and patient care through innovative, data-driven software solutions.

# URL to the Author's Profile (i.e., Github, Twitter, Stackoverflow, etc)
author-url: https://github.com/zoechow24

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
plugins:
  - jekyll-admin
  - jekyll-feed

# Permalink
permalink: "blog/:title"

# Compress
compress_html:
  clippings: all

# Defaults
defaults:
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      type: 'pages'
    values:
      layout: page

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/























